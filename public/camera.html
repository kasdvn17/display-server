<!doctype html>
<html lang="en" class="i18n-loading">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0e" />
    <title data-i18n="CAMERA_DOCUMENT_TITLE">Camera Nest Frame</title>
    <style>
      #locale-loader{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#111214;transition:opacity .18s ease,visibility .18s ease}#locale-loader::before{content:"";width:64px;height:3px;background:#c94e55;transform:scaleX(.18);transform-origin:left center;animation:locale-load 1s steps(4,end) infinite}@keyframes locale-load{50%{transform:scaleX(1)}100%{transform:scaleX(.18);transform-origin:right center}}html.i18n-ready #locale-loader{opacity:0;visibility:hidden;pointer-events:none}@media(prefers-reduced-motion:reduce){#locale-loader::before{animation:none;transform:scaleX(1)}}
    </style>
    <script src="/js/i18n.js?v=20260825-2"></script>
    <link rel="stylesheet" href="/css/camera.css?v=20260824-2" />
    <link rel="stylesheet" href="/css/camera-human-utility.css?v=20260825-1" />
  </head>
  <body>
    <div id="locale-loader" aria-hidden="false"></div>
    <main class="stage" id="stage">
      <video
        class="remote-video"
        id="remote-video"
        autoplay
        playsinline
      ></video>
      <video
        class="local-video"
        id="local-video"
        autoplay
        playsinline
        muted
      ></video>
      <div class="shade"></div>
      <section class="panel">
        <div class="brand">
          <div class="mark">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M4 7.8A2.8 2.8 0 0 1 6.8 5h7.4A2.8 2.8 0 0 1 17 7.8v8.4a2.8 2.8 0 0 1-2.8 2.8H6.8A2.8 2.8 0 0 1 4 16.2V7.8Z"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="m17 10 3-2v8l-3-2"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <strong>Camera Nest Frame</strong
            ><span data-i18n="CAMERA_SUBTITLE">Liên lạc riêng tư ngang hàng</span>
          </div>
        </div>
        <div class="error" id="error"></div>
        <form class="form" id="form">
          <label
            ><span class="label" data-i18n="CAMERA_TOKEN">Token camera</span
            ><input
              class="field"
              id="token"
              type="password"
              autocomplete="current-password"
              required
              placeholder="CAMERA_REMOTE_TOKEN"
          /></label>
          <label
            ><span class="label" data-i18n="YOUR_NAME">Tên của bạn</span
            ><input
              class="field"
              id="name"
              maxlength="60"
              autocomplete="name"
              value="Người xem từ xa"
              data-i18n-value="REMOTE_VIEWER"
          /></label>
          <label class="share"
            ><input id="share-video" type="checkbox" /> <span data-i18n="SHARE_CAMERA">Chia sẻ camera của
            thiết bị này với màn hình</span></label
          >
          <button class="button" id="start" type="submit" data-i18n="START_CALL">
            Bắt đầu cuộc gọi
          </button>
        </form>
        <div class="callbar">
          <div class="call-state">
            <strong
              ><span class="dot"></span
              ><span id="state-title" data-i18n="CALLING_DISPLAY">Đang gọi màn hình…</span></strong
            ><span id="state-detail" data-i18n="WAITING_FOR_DISPLAY">Đang chờ màn hình phản hồi</span>
          </div>
          <button class="button end" id="end" type="button" data-i18n="END_CALL">Kết thúc</button>
        </div>
        <div class="hint" data-i18n="CAMERA_HTTPS_HINT">
          Cần sử dụng HTTPS. Hình ảnh và âm thanh truyền trực tiếp giữa các
          thiết bị; server chỉ trao đổi thông tin kết nối.
        </div>
      </section>
    </main>
    <script src="/js/camera.js"></script>
  </body>
</html>
